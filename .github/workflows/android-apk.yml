name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - fix/android-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show repository files
        run: |
          pwd
          ls -la
          find app -maxdepth 6 -type f

      - name: Check Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/exammastery/ai/MainActivity.kt
          test -f app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamMastery-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
